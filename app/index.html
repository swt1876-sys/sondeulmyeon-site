<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>손들면 — 대출, 이제 은행이 먼저 찾아옵니다 </title>
  <!-- 글꼴: 구글 폰트의 Noto Sans KR. 인터넷이 없으면 기본 글꼴로 보입니다. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <!-- 앱 아이콘: 브라우저 탭(파비콘), 아이폰 홈 화면, 안드로이드 홈 화면(manifest) -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/logo/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#14213D">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 앱 전체가 그려지는 자리. 실제 화면 내용은 js/screens.js 가 채웁니다. -->
  <div id="app"></div>
  <!-- 앱이 시작하다 멈추면 하얀 화면 대신 오류 내용을 보여 줌 (캡처해서 물어보기 좋게) -->
  <script>
    window.addEventListener('error', function (ev) {
      var app = document.getElementById('app');
      if (app && !app.innerHTML.trim()) {
        app.innerHTML = '<div style="padding:24px;font-family:sans-serif;line-height:1.6"><b>앱을 시작하지 못했어요.</b><br>' +
          '아래 내용을 캡처해서 알려 주세요.<pre style="white-space:pre-wrap;background:#F4F6FA;padding:12px;border-radius:8px">' +
          String(ev.message || ev.error || '알 수 없는 오류').replace(/</g, '&lt;') + '\n' + (ev.filename || '').split('/').pop() + ':' + (ev.lineno || '') + '</pre></div>';
      }
    });
  </script>

  <!-- 스크립트 순서가 중요해요: 주소록(regions) → 창고(store) → 도구(ui) → 서버 연결(config, supabase, server) → 화면(screens) → 출입구(app) -->
  <script src="js/regions.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/config.js"></script>
  <!-- 서버(Supabase)와 대화하는 공식 도구. config.js에 주소를 넣었을 때만 불러와요(시연 모드는 인터넷 없이도 동작). -->
  <script>
    if (window.CONFIG && CONFIG.SUPABASE_URL) document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"><\/script>');
  </script>
  <script src="js/server.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
  <!-- 안드로이드 앱으로 실행될 때만: 휴대폰 뒤로 버튼 처리 -->
  <script src="js/native.js"></script>
</body>
</html>
